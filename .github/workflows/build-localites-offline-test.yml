name: Build localites offline France

on:
  push:
    branches:
      - localites-offline-test
    paths:
      - 'tools/build_localites_offline.py'
      - 'tools/finalize_localites_offline.py'
      - '.github/workflows/build-localites-offline-test.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-france:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: localites-offline-test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate nationwide offline locality database
        run: |
          rm -rf data/localites
          python tools/build_localites_offline.py --all --workers 8

      - name: Finalize and deduplicate nationwide database
        run: python tools/finalize_localites_offline.py

      - name: Verify database and known localities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('data/localites')
          index = json.loads((root / 'localites-index.json').read_text(encoding='utf-8'))
          assert index['department_count'] == 102, index['department_count']
          assert index['total_count'] > 10000, index['total_count']

          gironde = json.loads((root / 'localites-33.json').read_text(encoding='utf-8'))
          names = {item.get('k') for item in gironde['items']}
          assert 'blagon' in names
          assert 'anseillan' in names

          print('departments=', index['department_count'])
          print('total_count=', index['total_count'])
          print('total_bytes=', index['total_bytes'])
          print('blagon=OK')
          print('anseillan=OK')
          PY

      - name: Package database
        run: |
          zip -9 -r NPF_Q400_BASE_LOCALITES_FRANCE_OFFLINE_v4.zip \
            data/localites RAPPORT_BASE_LOCALITES_FRANCE.txt
          ls -lh NPF_Q400_BASE_LOCALITES_FRANCE_OFFLINE_v4.zip

      - name: Upload nationwide database
        uses: actions/upload-artifact@v4
        with:
          name: base-localites-france-offline-v4
          path: |
            NPF_Q400_BASE_LOCALITES_FRANCE_OFFLINE_v4.zip
            RAPPORT_BASE_LOCALITES_FRANCE.txt
          if-no-files-found: error
          retention-days: 90
