name: Test SIA VAC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sia-vac:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Inventorier les VAC SIA
        run: python tools/inventaire_vac_sia.py --output-dir vac-sia-resultats

      - name: Résumé
        if: always()
        run: |
          if [ -f vac-sia-resultats/summary.md ]; then
            cat vac-sia-resultats/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Le script n'a pas produit de résumé." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Conserver les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventaire-vac-sia
          path: vac-sia-resultats/
          if-no-files-found: warn
          retention-days: 7
